name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: npm ci
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Extract and validate release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/check-release.mjs --extract-release-notes "$version"
          node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
