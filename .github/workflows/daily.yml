name: daily-job-digest

on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC = 06:30/07:30 Israel time
  workflow_dispatch: {}

concurrency:
  group: daily-job-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "DEPLOY_KEY secret is missing: the final push to main would be rejected by the ruleset." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright==1.63.0
      - run: playwright install --with-deps chromium
      - name: Crawl and diff
        run: python run.py
      - name: Send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python send_email.py
      - name: Build dashboard
        if: always()
        run: python build_dashboard.py
      - name: Commit database and dashboard
        if: always()
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db docs/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "daily crawl $(date -u +%F)"
          # The write deploy key is the bypass actor of the main ruleset (the Actions bot cannot be one on a
          # personal repo). It is written to disk only for this push, never for the crawl steps.
          key="$RUNNER_TEMP/deploy_key"
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git pull --rebase origin main
          git push origin HEAD:main
          rm -f "$key"
