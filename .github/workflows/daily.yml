name: daily-job-digest

on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC = 06:30/07:30 Israel time
  workflow_dispatch: {}

concurrency:
  group: daily-job-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy key so the push can bypass the main ruleset (the Actions bot cannot on a personal repo).
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright==1.63.0
      - run: playwright install --with-deps chromium
      - name: Crawl and diff
        run: python run.py
      - name: Send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python send_email.py
      - name: Build dashboard
        if: always()
        run: python build_dashboard.py
      - name: Commit database and dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db docs/index.html
          git diff --cached --quiet || git commit -m "daily crawl $(date -u +%F)"
          git push
